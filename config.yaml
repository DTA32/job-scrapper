keywords:
  - software engineer
  - data analyst

limit: 2
concurrency: 2
output_dir: output

# Drop jobs older than this many hours. Comment out / remove for no filter.
# Per-site override available under sites.<name>.max_age_hours.
max_age_hours: 720

# Fields included by default for every site (canonical names).
# Allowed: title, company, url, location, salary, posted_date, posted_at,
# work_type, employment_type, experience_level, job_id, matched_keyword.
# site, matched_keyword, title, company, url are always included.
default_fields:
  - title
  - company
  - location
  - url
  - salary
  - posted_date

sites:
  jobstreet:
    enabled: true
    url_template: "https://id.jobstreet.com/id/{keyword_slug}-jobs"

  glints:
    enabled: true
    url_template: "https://glints.com/id/opportunities/jobs/explore?keyword={keyword}&country=ID"
    fields:
      - title
      - company
      - location
      - url
      - salary
      - posted_date
      - work_type
      - experience_level

  linkedin:
    enabled: true
    url_template: "https://www.linkedin.com/jobs-guest/jobs/api/seeMoreJobPostings/search?keywords={keyword}&location=Indonesia&start=0"
    fields:
      - title
      - company
      - location
      - url
      - posted_date

  indeed:
    enabled: true
    url_template: "https://id.indeed.com/jobs?q={keyword_plus}&l=Indonesia"
