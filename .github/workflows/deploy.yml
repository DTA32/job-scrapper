name: Build & Deploy scraper

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag_sha: ${{ steps.tags.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: tags
        run: |
          # ghcr.io requires lowercase; github.repository may contain uppercase chars
          REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          # rolling tag — always points to the newest build
          echo "latest=ghcr.io/${REPO_LOWER}:mcp-latest" >> "$GITHUB_OUTPUT"
          # immutable tag pinned to this exact commit, used for deployment
          echo "sha=ghcr.io/${REPO_LOWER}:mcp-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push mcp-server image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: mcp-server
          push: true
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp
          tags: |
            ${{ steps.tags.outputs.latest }}
            ${{ steps.tags.outputs.sha }}

  build-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag_sha: ${{ steps.tags.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: tags
        run: |
          # ghcr.io requires lowercase; github.repository may contain uppercase chars
          REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          # rolling tag — always points to the newest build
          echo "latest=ghcr.io/${REPO_LOWER}:bot-latest" >> "$GITHUB_OUTPUT"
          # immutable tag pinned to this exact commit, used for deployment
          echo "sha=ghcr.io/${REPO_LOWER}:bot-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push bot image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: bot
          push: true
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot
          tags: |
            ${{ steps.tags.outputs.latest }}
            ${{ steps.tags.outputs.sha }}

  deploy-mcp:
    needs: build-mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure deploy dir
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ~/job-scrapper

      - name: Copy compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: "~/job-scrapper"

      - name: Deploy scraper-mcp
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: MCP_IMAGE,MONGO_ROOT_USER,MONGO_ROOT_PASSWORD,MONGO_DB_NAME,MONGO_COLLECTION_NAME
          script: |
            set -euo pipefail
            cd ~/job-scrapper

            # one-time migration: remove legacy docker run container (different name, same port)
            docker rm -f scraper-mcp 2>/dev/null || true

            C="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            $C --profile mcp pull
            $C --profile mcp up -d --no-build
            $C ps
        env:
          MCP_IMAGE: ${{ needs.build-mcp.outputs.image_tag_sha }}
          MONGO_ROOT_USER: ${{ vars.MONGO_ROOT_USER || 'admin' }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_DB_NAME: ${{ vars.MONGO_DB_NAME || 'job_scraper' }}
          MONGO_COLLECTION_NAME: ${{ vars.MONGO_COLLECTION_NAME || 'scrape_runs' }}

  deploy-bot:
    needs: [build-bot, deploy-mcp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure deploy dir
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ~/job-scrapper

      - name: Copy compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: "~/job-scrapper"

      - name: Deploy scraper-bot
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: BOT_IMAGE,DISCORD_BOT_TOKEN,DISCORD_CHANNEL_ID,CLAUDE_CONFIG_DIR,CLAUDE_CONFIG_FILE,TZ
          script: |
            set -euo pipefail
            cd ~/job-scrapper

            # one-time migration: remove legacy docker run container (different name)
            docker rm -f scraper-bot 2>/dev/null || true

            C="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            $C --profile bot pull
            $C --profile bot up -d --no-build
            $C ps
        env:
          BOT_IMAGE: ${{ needs.build-bot.outputs.image_tag_sha }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          CLAUDE_CONFIG_DIR: ${{ vars.CLAUDE_CONFIG_DIR }}
          CLAUDE_CONFIG_FILE: ${{ vars.CLAUDE_CONFIG_FILE }}
          TZ: ${{ vars.TZ || 'Asia/Jakarta' }}
