name: Build & Deploy scraper

on:
  push:
    branches: [main] # auto-deploy on merge to main
  workflow_dispatch:
    # or trigger manually from GitHub Actions UI

jobs:
  # 1. Build MCP server Docker image and push to ghcr.io
  build-mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag_sha: ${{ steps.tags.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: tags
        run: |
          # ghcr.io requires lowercase; github.repository may contain uppercase chars
          REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          # rolling tag — always points to the newest build
          echo "latest=ghcr.io/${REPO_LOWER}:mcp-latest" >> "$GITHUB_OUTPUT"
          # immutable tag pinned to this exact commit, used for deployment
          echo "sha=ghcr.io/${REPO_LOWER}:mcp-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push mcp-server image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: mcp-server
          push: true
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp
          tags: |
            ${{ steps.tags.outputs.latest }}
            ${{ steps.tags.outputs.sha }}

  # 2. Test the bot (node --test in cron/). Its image is built from Dockerfile.bot for
  #    the k8s CronJob, outside this workflow (k8s/README.md).
  test-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cron/package-lock.json

      - name: Install and test
        working-directory: cron
        run: npm ci --no-audit --no-fund && npm test

  # 3. SSH into VPS → pull new MCP image → restart container (runs after build-mcp)
  deploy-mcp:
    needs: build-mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure deploy dir
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ~/job-scrapper

      - name: Copy compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: "~/job-scrapper"

      - name: Deploy scraper-mcp
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: MCP_IMAGE,MONGO_ROOT_USER,MONGO_ROOT_PASSWORD,MONGO_DB_NAME,MONGO_COLLECTION_NAME
          script: |
            set -euo pipefail
            cd ~/job-scrapper

            # one-time migration: remove legacy docker run container (different name, same port)
            docker rm -f scraper-mcp 2>/dev/null || true

            C="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            $C --profile mcp pull
            $C --profile mcp up -d --no-build
            $C ps
        env:
          MCP_IMAGE: ${{ needs.build-mcp.outputs.image_tag_sha }}
          MONGO_ROOT_USER: ${{ vars.MONGO_ROOT_USER || 'admin' }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_DB_NAME: ${{ vars.MONGO_DB_NAME || 'job_scraper' }}
          MONGO_COLLECTION_NAME: ${{ vars.MONGO_COLLECTION_NAME || 'scrape_runs' }}
