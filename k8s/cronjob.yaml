apiVersion: batch/v1
kind: CronJob
metadata:
  name: job-scraper-bot
spec:
  schedule: "0 20 * * *"
  timeZone: "Asia/Jakarta"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - vps-01eb7b22
          containers:
            - name: job-scraper-bot
              image: dta32/job-scrapper-orangemangodimz-bot:v1.0.6 # or replacedbycicd
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /workspace/scraper-bot/cron/run-scraper.sh
              envFrom:
                - configMapRef:
                    name: job-scraper-config
                - secretRef:
                    name: job-scraper-secret
              volumeMounts:
                - name: claude-config
                  mountPath: /claude-config
          volumes:
            - name: claude-config
              persistentVolumeClaim:
                claimName: job-scraper-claude-pvc
          restartPolicy: OnFailure
