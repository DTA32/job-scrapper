apiVersion: v1
kind: ConfigMap
metadata:
  name: job-scraper-config
data:
  # job-scraper MCP endpoint the bot's digest run calls (cron/run-digest.js).
  MCP_URL: "http://job-scraper-mcp-service/mcp"
  # Cap on the scrape_jobs call. The MCP server sends nothing until the scrape
  # finishes, so this is the only timeout on it.
  SCRAPE_TIMEOUT_MS: "1800000"
  MONGO_DB_NAME: "job-scraper"
  MONGO_COLLECTION_NAME: "scrape_runs"
  MONGO_SERVER_SELECTION_TIMEOUT_MS: "3000"
  TZ: "Asia/Jakarta"
  MAX_CHARS: "1900"
  # Requirements bullets rendered per job, and the length cap per bullet.
  REQ_MAX_ITEMS: "5"
  REQ_MAX_ITEM_CHARS: "80"
